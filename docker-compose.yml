services:
  redis_main:
    image: redis:alpine
    container_name: redis_main
    ports:
      - "6379:6379"
    volumes:
      - redis_main_data:/data
    restart: unless-stopped
    networks:
      - app_network

  redis_adapter:
    image: redis:alpine
    container_name: redis_adapter
    ports:
      - "6380:6379"
    volumes:
      - redis_adapter_data:/data
    restart: unless-stopped
    networks:
      - app_network

  realtime_whiteboard:
    build: .
    expose:
      - "3001"
    env_file:
      - .env.production
    environment:
      # overrides env_file — container networking uses service names not localhost
      - REDIS_HOST=redis_main
      - REDIS_ADAPTER_HOST=redis_adapter
      - REDIS_ADAPTER_PORT=6379
    depends_on:
      - redis_main
      - redis_adapter
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      replicas: 2

  persistence_service:
    build: ../processingServer
    expose:
      - "3002"
    env_file:
      - ../processingServer/.env.production
    environment:
      - REDIS_HOST=redis_main
      - REDIS_ADAPTER_HOST=redis_adapter
    depends_on:
      - redis_main
      - redis_adapter
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      replicas: 2

  onboarding_service:
    build: ../onboardingServer
    # container_name removed
    expose:
      - "3004"
    env_file:
      - ../onboardingServer/.env.production
    environment:
      - REDIS_HOST=redis_main
      - REDIS_ADAPTER_HOST=redis_adapter
    depends_on:
      - redis_main
      - redis_adapter
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      replicas: 2
  # snapshotting_service:
  #   build: ../snapshottingServer
  #   container_name: snapshotting_service
  #   expose:
  #     - "3003"
  #   env_file:
  #     - ../snapshottingServer/.env.production
  #   environment:
  #     - REDIS_HOST=redis_main
  #     - REDIS_ADAPTER_HOST=redis_adapter
  #   depends_on:
  #     - redis_main
  #     - redis_adapter
  #   restart: unless-stopped
  #   networks:
  #     - app_network

  nextjs:
    build:
      context: .
      dockerfile: client.Dockerfile
    container_name: nextjs
    expose:
      - "3000"
    env_file:
      - .env.production
    restart: unless-stopped
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - realtime_whiteboard
      - persistence_service
      - onboarding_service
      - nextjs
    restart: unless-stopped
    networks:
      - app_network
  # Monitoring stack not implemented yet
