services:
  redis_test:
    image: redis:alpine
    ports:
      - "6381:6379"
    volumes:
      - redis_test_data:/data
    restart: unless-stopped
    networks:
      - test_network

  # Redis Adapter (Socket.IO adapter)
  redis_adapter_test:
    image: redis:alpine
    ports:
      - "6382:6379"
    volumes:
      - redis_adapter_test_data:/data
    restart: unless-stopped
    networks:
      - test_network

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongodb_test_data:/data/db
    networks:
      - test_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]

  mongo_test_init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy # wait for healthcheck, not just "started"
    restart: "no"
    networks:
      - test_network
    entrypoint: >
      bash -c "
        for i in \$(seq 1 10); do
          mongosh --host mongo:27017 --eval \"
            try { rs.status(); print('Already initialized.'); }
            catch(e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); print('Initialized.'); }
          \" && exit 0;
          echo 'Retrying in 3s...'; sleep 3;
        done;
        exit 1
      "

volumes:
  redis_test_data:
  redis_adapter_test_data:
  mongodb_test_data:

networks:
  test_network:
    driver: bridge
