config:
  target: 'http://localhost:8080'
  phases:
    - duration: 30
      arrivalRate: 5 # 5 new connections per second
      name: 'Sticky session test'

  # Enable WebSocket engine
  engines:
    socketio: {}

  # Variables to track which servers we connect to
  variables:
    server_port: ''

scenarios:
  - name: 'WebSocket sticky session test'
    engine: socketio
    flow:
      # Connect to Socket.IO
      - emit:
          channel: 'get-server-info'
          data: {}

      # Wait for server info response
      - think: 1

      # Send drawing events to test stickiness
      - loop:
          - emit:
              channel: 'drawing-event'
              data:
                type: 'draw'
                x: '{{ $randomInt(0, 800) }}'
                y: '{{ $randomInt(0, 600) }}'
                color: '#{{ $randomString(6) }}'

          - think: 0.5

          - emit:
              channel: 'test-message'
              data:
                message: 'test from {{ $uuid }}'
                timestamp: '{{ $timestamp }}'

        count: 10 # Send 10 events per connection

      # Keep connection alive to test persistence
      - think: 5
