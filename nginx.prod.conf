# =============================================================================
# TROUBLESHOOTING QUICK REFERENCE
# =============================================================================
# 502 Bad Gateway     => upstream container is down or wrong port
#                       run: docker compose logs realtime_whiteboard (or 2/3/4)
# 504 Gateway Timeout => upstream is alive but not responding in time
#                       check proxy_read_timeout / app hanging
# 111 Connection Refused => container crashed or port mismatch
#                       run: docker compose ps
# upstream not found  => service name typo or container not on app_network
#                       run: docker network inspect <project>_app_network
# =============================================================================

worker_processes auto;
# auto = one worker per CPU core
# if you see high CPU on nginx container: docker stats nginx

events {
    worker_connections 2500;
    # max simultaneous connections per worker
    # total capacity = worker_processes * worker_connections
    # if you hit limits you'll see: "worker_connections are not enough" in error log
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # --- Global proxy headers (inherited by location blocks with no proxy_set_header) ---
    # WARNING: if a location block declares ANY proxy_set_header, inheritance is
    # fully disabled for that block  headers there explicitly
    # Useful as a safety net for simple location blocks that don't need upgrades

    # Pass the original Host header (domain/port) to backend services
    # Without this, backends see nginx's internal hostname instead
            proxy_set_header Origin            $http_origin;        # forward original Origin header for CORS
    proxy_set_header Host $http_host;  # preserves host AND port e.g. localhost:3004
                                    # $host strips the port - use $http_host for origin-aware servic

    # Pass the real client IP to backend services
    # Without this, backends see nginx's container IP (e.g. 172.x.x.x)
    proxy_set_header X-Real-IP         $remote_addr;

    # Append client IP to the forwarded chain (preserves hops through multiple proxies)
    # Backends can read the full request path: client => proxy1 => proxy2 => nginx
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # Tell backends whether the original request was HTTP or HTTPS
    # Important for redirect logic and secure cookie generation
    proxy_set_header X-Forwarded-Proto $scheme;

    sendfile        on;
    keepalive_timeout 65;
    # keepalive_timeout: how long to keep idle client connections open
    # lower this if you're seeing too many open connections: docker exec nginx ss -s

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # --- Log locations inside the nginx Alpine container ---
    # To tail logs live: docker logs -f nginx
    # Or exec in:        docker exec -it nginx tail -f /var/log/nginx/error.log
    access_log  /var/log/nginx/access.log main;
    error_log   /var/log/nginx/error.log warn;
    # warn level shows: warn, error, crit, alert, emerg
    # change to "debug" temporarily if you need verbose output (very noisy)

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    # if static assets seem uncompressed check: curl -H "Accept-Encoding: gzip" -I http://localhost/your.js

    resolver 127.0.0.11 valid=30s;

    # =========================================================================
    # UPSTREAM: Socket.IO (dedicated - never pool WS with REST)
    # =========================================================================
    # If this goes down nginx will log:
    #   "connect() failed (111: Connection refused) while connecting to upstream"
    # Check: docker compose logs realtime_whiteboard
    # =========================================================================
    upstream socketio_backend {
        server realtime_whiteboard:3001;
    }

    # =========================================================================
    # UPSTREAM: Individual REST services (each routed by path prefix)
    # =========================================================================
    # These are distinct apps - do NOT pool them together with least_conn
    # least_conn makes sense for identical replicas, not different services
    # Check a specific service: docker compose logs <service_name>
    # =========================================================================
    upstream onboarding_service {
        server onboarding_service:3004;
    }
    # upstream snapshotting_service {
    #     server snapshotting_service:3003;
    # }
    upstream persistence_service {
        server persistence_service:3002;
    }

    # =========================================================================
    # UPSTREAM: Next.js frontend
    # =========================================================================
    # Single instance - if you get 502 on / check: docker compose logs nextjs
    # Common cause: Next.js build failed, check client.Dockerfile output
    # =========================================================================
    upstream nextjs_frontend {
        server nextjs:3000;
    }

    server {
        listen 80;
        server_name localhost;
        # In production replace localhost with your actual domain
        # and add a second server block for HTTPS on 443

        # =====================================================================
        # Socket.IO endpoint
        # =====================================================================
        # proxy_buffering off: required for real-time - never turn this on here
        # proxy_read_timeout 86400: 24h, keeps WS connections alive
        # Upgrade + Connection headers: required for WebSocket upgrade handshake
        #
        # Symptoms of misconfiguration:
        #   - Client falls back to polling only => missing Upgrade/Connection headers
        #   - Frequent reconnects => proxy_read_timeout too low
        #   - 400 Session ID Unknown => ip_hash missing (client hitting different instance)
        # =====================================================================
        location /socket.io/ {
            proxy_pass http://socketio_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade     $http_upgrade; # initiates the HTTP => WebSocket upgrade handshake
            proxy_set_header Connection  "Upgrade";     # keeps the upgraded connection alive (not closed after response)
            # inheritance disabled by Upgrade redeclaration above 
            proxy_set_header Origin            $http_origin;        # forward original Origin header for CORS
            proxy_set_header Host $http_host;  # preserves host AND port e.g. localhost:3004
                                    # $host strips the port - use $http_host for origin-aware servic
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_send_timeout 86400;   # 24hr: allows persistent WS connections without timeout
            proxy_read_timeout 86400;   # 24hr: prevents long-polling/WS read timeouts
            proxy_connect_timeout 60;   # if node app takes >60s to start: raise this
            proxy_buffering off;        # NEVER buffer WS - messages must stream in real time
        }

        # =====================================================================
        # REST API - each service gets its own location block
        # =====================================================================
        # Routes by path prefix => dedicated upstream (no random load balancing)
        # location /x (no trailing slash) matches /x, /x/, and /x/anything
        #
        # 502 here => that specific service is down: docker compose ps
        # 404 here => your Express routes don't match this prefix
        # =====================================================================
        location /onboard {
            proxy_pass http://onboarding_service;
            # inheritance disabled 
            proxy_set_header Origin            $http_origin;        # forward original Origin header for CORS
            proxy_set_header Host $http_host;  # preserves host AND port e.g. localhost:3004
                                    # $host strips the port - use $http_host for origin-aware servic
            proxy_set_header Origin            $http_origin;        # forward original Origin header for CORS
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # location /snapshots {
        #     proxy_pass http://snapshotting_service;
        #     # inheritance disabled 
        #     proxy_set_header Origin            $http_origin;        # forward original Origin header for CORS
        #     proxy_set_header Host $http_host;  # preserves host AND port e.g. localhost:3004
        #                             # $host strips the port - use $http_host for origin-aware servic
        #     proxy_set_header X-Real-IP         $remote_addr;
        #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        location /persist {
            proxy_pass http://persistence_service;
            # inheritance disabled 
            proxy_set_header Origin            $http_origin;        # forward original Origin header for CORS
            proxy_set_header Host $http_host;  # preserves host AND port e.g. localhost:3004
                                    # $host strips the port - use $http_host for origin-aware servic
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =====================================================================
        # Static assets (JS, CSS, images, fonts)
        # =====================================================================
        # Served by Next.js but cached aggressively at the nginx level
        # Cache-Control "immutable" = browser won't re-request until cache expires
        #
        # If you deploy new assets and users see stale files:
        #   => Next.js content-hashes filenames so this shouldn't happen
        #   => if it does: check your Next.js build output for hashed filenames
        # =====================================================================
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|map)$ {
            proxy_pass http://nextjs_frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
            # inheritance disabled by add_header 
            proxy_set_header Origin            $http_origin;        # forward original Origin header for CORS
            proxy_set_header Host $http_host;  # preserves host AND port e.g. localhost:3004
                                    # $host strips the port - use $http_host for origin-aware servic
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =====================================================================
        # Next.js catch-all (pages, HMR in dev, Next.js internals)
        # =====================================================================
        # Upgrade/Connection headers included for Next.js HMR websocket in dev
        # In production these are harmless to keep
        #
        # 502 here => nextjs container is down: docker compose logs nextjs
        # Blank page => Next.js built successfully but NEXT_PUBLIC_ env vars
        #              are wrong (they're baked in at build time, not runtime)
        # =====================================================================
        location / {
            proxy_pass http://nextjs_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade     $http_upgrade; # initiates the HTTP => WebSocket upgrade handshake (HMR in dev)
            proxy_set_header Connection  "upgrade";     # keeps the upgraded connection alive
            # inheritance disabled by Upgrade redeclaration above 
            proxy_set_header Origin            $http_origin;        # forward original Origin header for CORS
            proxy_set_header Host $http_host;  # preserves host AND port e.g. localhost:3004
                                    # $host strips the port - use $http_host for origin-aware servic
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =====================================================================
        # Error page
        # =====================================================================
        # /usr/share/nginx/html is the correct path in nginx:alpine
        # if you see "open() failed" in logs for 50x.html this path is wrong
        # No proxy_set_header redeclarations here - inherits from http block cleanly
        # =====================================================================
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}