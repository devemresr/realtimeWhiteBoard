global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'node_backend'
    static_configs:
      - targets:
          - 'node_app_1:3001'
          - 'node_app_2:3002'
          - 'node_app_3:3003'
          - 'node_app_4:3004'
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
