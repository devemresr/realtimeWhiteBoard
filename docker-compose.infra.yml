services:
  # Redis Main (streams + cache)
  redis_main:
    image: redis:alpine
    container_name: redis_main
    ports:
      - "6379:6379"
    volumes:
      - redis_main_data:/data
    restart: unless-stopped
    networks:
      - app_network

  # Redis Adapter (Socket.IO adapter)
  redis_adapter:
    image: redis:alpine
    container_name: redis_adapter
    ports:
      - "6380:6379"
    volumes:
      - redis_adapter_data:/data
    restart: unless-stopped
    networks:
      - app_network

  # MongoDB 
  mongo:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - app_network
    environment:
      - MONGO_INITDB_DATABASE=myapp_dev
    command: [ "--replSet", "rs0", "--bind_ip_all" ]

  mongo-init:
    image: mongo:7
    depends_on:
      - mongo
    restart: "no"
    networks:
      - app_network
    entrypoint: >
      bash -c "sleep 5 && mongosh --host mongo:27017 --eval \"rs.initiate({_id:
      'rs0', members: [{_id: 0, host: 'localhost:27017'}]})\""

volumes:
  redis_main_data:
  redis_adapter_data:
  mongodb_data:

networks:
  app_network:
    driver: bridge
