services:
  # Redis Main (streams + cache)
  redis_main:
    image: redis:alpine
    # container_name: redis_main
    ports:
      - "6379:6379"
    volumes:
      - redis_main_data:/data
    restart: unless-stopped
    networks:
      - dev_network

  # Redis Adapter (Socket.IO adapter)
  redis_adapter:
    image: redis:alpine
    # container_name: redis_adapter
    ports:
      - "6380:6379"
    volumes:
      - redis_adapter_data:/data
    restart: unless-stopped
    networks:
      - dev_network

  # MongoDB
  mongo:
    image: mongo:7
    # container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - dev_network
    command: ["--replSet", "rs0", "--bind_ip_all"]

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy # wait for healthcheck, not just "started"
    restart: "no"
    networks:
      - dev_network
    entrypoint: >
      bash -c "
        for i in \$(seq 1 10); do
          mongosh --host mongo:27017 --eval \"
            try { rs.status(); print('Already initialized.'); }
            catch(e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); print('Initialized.'); }
          \" && exit 0;
          echo 'Retrying in 3s...'; sleep 3;
        done;
        exit 1
      "
  nginx:
    image: nginx:alpine
    ports:
      - "3010:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.dev.conf:ro
    depends_on:
      - realtime_whiteboard
    restart: unless-stopped
    networks:
      - dev_network

  realtime_whiteboard:
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    build: .
    expose:
      - "3001"
    environment:
      - REDIS_HOST=redis_main
      - REDIS_PORT=6379
      - REDIS_ADAPTER_HOST=redis_adapter
      - REDIS_ADAPTER_PORT=6379
    networks:
      - dev_network

  prometheus:
    image: prom/prometheus:latest
    # container_name: prometheus
    ports:
      - "9092:9090"
    volumes:
      - ./prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - dev_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # todo implement grafana
    # grafana:
    #   image: grafana/grafana:latest
  #   ports:
  #     - "3005:3000"
  #   env_file:
  #     - .env.production
  #   environment:
  #     # todo: move these to CI secrets before deploying
  #     - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
  #     - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
  #     - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP}
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   depends_on:
  #     - prometheus
  #   restart: unless-stopped
  #   networks:
  #     - dev_network

volumes:
  redis_main_data:
  redis_adapter_data:
  mongodb_data:
  prometheus_data:

networks:
  dev_network:
    driver: bridge
