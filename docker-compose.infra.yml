services:
  # Redis Main (streams + cache)
  redis_main:
    image: redis:alpine
    container_name: redis_main
    ports:
      - "6379:6379"
    volumes:
      - redis_main_data:/data
    restart: unless-stopped
    networks:
      - dev_network

  # Redis Adapter (Socket.IO adapter)
  redis_adapter:
    image: redis:alpine
    container_name: redis_adapter
    ports:
      - "6380:6379"
    volumes:
      - redis_adapter_data:/data
    restart: unless-stopped
    networks:
      - dev_network

  # MongoDB
  mongo:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - dev_network
    environment:
      - MONGO_INITDB_DATABASE=myapp_dev
    command: ["--replSet", "rs0", "--bind_ip_all"]

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy # wait for healthcheck, not just "started"
    restart: "no"
    networks:
      - dev_network
    entrypoint: >
      bash -c "sleep 5 && mongosh --host mongo:27017 --eval \"rs.initiate({_id:
      'rs0', members: [{_id: 0, host: 'mongo:27017'}]})\""

volumes:
  redis_main_data:
  redis_adapter_data:
  mongodb_data:

networks:
  dev_network:
    driver: bridge
